[project]
name = "sentinel-shared"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grpcio>=1.66",
    "protobuf>=5.28",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.66",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proto_gen", "observability"]
