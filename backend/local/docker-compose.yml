# Day 1 infra + service skeletons. No Postgres container — Postgres is
# hosted on Supabase (project `senitel`); services will read the connection
# string from env once they actually touch the DB (Day 2+).
#
# Run standalone: `docker compose -f backend/local/docker-compose.yml up`
# Run with frontend included: `docker compose up` from the repo root.

services:
  # --- Event backbone ---
  kafka:
    image: apache/kafka:3.9.0
    container_name: sentinel-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - ./kafka/data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # --- Cache / feature-store backing store ---
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Observability pipeline (OTel Collector -> Loki/Mimir/Tempo -> Grafana) ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: sentinel-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "13133:13133" # health_check extension — host-side checks only, image has no in-container wget/curl/shell

  loki:
    image: grafana/loki:3.2.1
    container_name: sentinel-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki/data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mimir:
    image: grafana/mimir:2.14.1
    container_name: sentinel-mimir
    command: ["-target=all", "-config.file=/etc/mimir/mimir.yaml"]
    ports:
      - "9009:8080" # host-side readiness checks only — image has no in-container wget/curl/shell to healthcheck with
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - ./mimir/data:/data

  tempo:
    image: grafana/tempo:2.6.1
    container_name: sentinel-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - ./tempo/data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.3.0
    container_name: sentinel-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin # local dev only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      mimir:
        condition: service_started # image has no in-container healthcheck tooling, see above
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --- Application services (skeletons: /healthz only, Day 2+ fills these in) ---
  ingestion:
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    container_name: sentinel-ingestion
    ports:
      - "8001:8000"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  scoring:
    build:
      context: ..
      dockerfile: services/scoring/Dockerfile
    container_name: sentinel-scoring
    ports:
      - "8002:8000"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  feature-store:
    build:
      context: ..
      dockerfile: services/feature-store/Dockerfile
    container_name: sentinel-feature-store
    ports:
      - "8003:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  case-management:
    build:
      context: ..
      dockerfile: services/case-management/Dockerfile
    container_name: sentinel-case-management
    ports:
      - "8004:8000"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
