[project]
name = "sentinel-scoring"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "grpcio>=1.66",
    "aiokafka>=0.12",
    "sentinel-shared",
]

[tool.uv.sources]
sentinel-shared = { path = "../../shared", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
